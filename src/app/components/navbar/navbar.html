<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand Logo & Title -->
      <div class="flex items-center space-x-3 cursor-pointer" (click)="selectView('jobs')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-fuchsia-500 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight text-white flex items-center gap-1.5">
            DynaSim <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-400">CareerAI</span>
          </span>
          <p class="text-[11px] text-slate-400 font-medium tracking-wide">
            LS-DYNA • Crash Safety • OMSA Analytics • AI
          </p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="hidden md:flex items-center space-x-1">
        <button
          (click)="selectView('jobs')"
          [class]="currentView === 'jobs' 
            ? 'bg-slate-800 text-cyan-400 border-b-2 border-cyan-400' 
            : 'text-slate-300 hover:text-white hover:bg-slate-800/60'"
          class="px-3.5 py-2 text-sm font-medium rounded-t-lg transition flex items-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          Explore Roles
        </button>

        <button
          (click)="selectView('skills')"
          [class]="currentView === 'skills' 
            ? 'bg-slate-800 text-cyan-400 border-b-2 border-cyan-400' 
            : 'text-slate-300 hover:text-white hover:bg-slate-800/60'"
          class="px-3.5 py-2 text-sm font-medium rounded-t-lg transition flex items-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
          Skills Matrix
        </button>

        <button
          (click)="selectView('analyzer')"
          [class]="currentView === 'analyzer' 
            ? 'bg-slate-800 text-cyan-400 border-b-2 border-cyan-400' 
            : 'text-slate-300 hover:text-white hover:bg-slate-800/60'"
          class="px-3.5 py-2 text-sm font-medium rounded-t-lg transition flex items-center gap-2"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          JD Match Scanner
        </button>

        <button
          (click)="selectView('applications')"
          [class]="currentView === 'applications' 
            ? 'bg-slate-800 text-cyan-400 border-b-2 border-cyan-400' 
            : 'text-slate-300 hover:text-white hover:bg-slate-800/60'"
          class="px-3.5 py-2 text-sm font-medium rounded-t-lg transition flex items-center gap-2 relative"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
          </svg>
          Applications
          <span 
            *ngIf="jobService.applications().length > 0"
            class="ml-1 px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-cyan-500 text-slate-950"
          >
            {{ jobService.applications().length }}
          </span>
        </button>
      </nav>

      <!-- Right Indicator -->
      <div class="flex items-center space-x-3">
        <div class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium rounded-lg bg-emerald-950/40 text-emerald-300 border border-emerald-800/50 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Zero-Config / Client-Ready</span>
        </div>
      </div>

    </div>

    <!-- Mobile Navigation Bar -->
    <div class="md:hidden flex items-center justify-around py-2 border-t border-slate-800 text-xs">
      <button 
        (click)="selectView('jobs')"
        [class.text-cyan-400]="currentView === 'jobs'"
        class="py-1 px-2 font-medium text-slate-300"
      >
        Roles
      </button>
      <button 
        (click)="selectView('skills')"
        [class.text-cyan-400]="currentView === 'skills'"
        class="py-1 px-2 font-medium text-slate-300"
      >
        Skills
      </button>
      <button 
        (click)="selectView('analyzer')"
        [class.text-cyan-400]="currentView === 'analyzer'"
        class="py-1 px-2 font-medium text-slate-300"
      >
        Scanner
      </button>
      <button 
        (click)="selectView('applications')"
        [class.text-cyan-400]="currentView === 'applications'"
        class="py-1 px-2 font-medium text-slate-300"
      >
        Tracker ({{ jobService.applications().length }})
      </button>
    </div>
  </div>
</header>
